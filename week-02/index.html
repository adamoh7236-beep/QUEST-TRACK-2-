<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용어 퀴즈</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--sub:#667085;--line:#dfe3ee;--accent:#4f46e5;--ok:#16a34a;--okbg:#e8f7ee;--no:#dc2626;--nobg:#fdeaea}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c202c;--ink:#eef0f6;--sub:#9aa3b8;--line:#2f3547;--accent:#8b85ff;--ok:#4ade80;--okbg:#14301f;--no:#f87171;--nobg:#3a1a1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.sub{color:var(--sub);font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 18px}
.part{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.part:hover{border-color:var(--accent)}
.part b{display:block}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt.hit{border-color:#16a34a;background:#16a34a;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.ox{flex:1;font-size:1.6rem;font-weight:700;padding:18px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--sub)}
.q{font-size:1.1rem;font-weight:600;margin:14px 0 4px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--nobg);border:1px solid var(--no)}
.fb b{display:block}
.mrow{margin-top:12px}
.mrow .t{font-weight:600}
.mrow .opt{display:inline-block;width:auto;margin:6px 6px 0 0;padding:6px 12px}
.score{font-size:2.6rem;font-weight:800;margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;min-height:40px}
.chip{background:color-mix(in srgb,var(--accent) 15%,var(--card));border:1px solid var(--accent);border-radius:20px;padding:4px 12px}
/* 우주선 안 1인칭 우주 배경 */
:root{--bg:#04050c;--card:rgba(14,18,36,.84);--ink:#eef0f6;--sub:#9aa3b8;--line:#33405f;--accent:#8b85ff;--ok:#4ade80;--okbg:#14301f;--no:#f87171;--nobg:#3a1a1d}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main{position:relative;z-index:2;padding-bottom:200px}
.card{backdrop-filter:blur(4px)}
#cockpit{position:fixed;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 0 10px #0d111c,inset 0 0 0 12px #3a4560,inset 0 0 140px 30px rgba(0,0,0,.65)}
#hud{position:fixed;top:16px;right:24px;z-index:6;pointer-events:none;font-size:.85rem;color:var(--sub);background:rgba(14,18,36,.7);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.steer{position:fixed;bottom:4px;z-index:6;width:56px;height:44px;border-radius:10px;border:1px solid #3a4560;background:#161c2c;color:#cbd5f0;font-size:1.1rem;touch-action:none;user-select:none}
.steer:active{background:#2a3350}
#cp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cockpit::after{display:none;content:"";position:absolute;left:0;right:0;bottom:0;height:52px;border-top:2px solid #3a4560;
 background:radial-gradient(circle at 12% 50%,#4ade80 0 4px,transparent 5px),radial-gradient(circle at 18% 50%,#facc15 0 4px,transparent 5px),radial-gradient(circle at 24% 50%,#f87171 0 4px,transparent 5px),linear-gradient(#0d111c,#070a12)}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div id="cockpit"><canvas id="cp"></canvas></div>
<div id="hud"></div>
<button class="steer" id="bl" style="left:10px" aria-label="왼쪽으로">◀</button>
<button class="steer" id="br" style="right:10px" aria-label="오른쪽으로">▶</button>
<main>
  <h1>용어 퀴즈</h1>
  <div class="sub">오늘 배운 용어로 AI 에게 정확하게 부탁해 봐요</div>
  <div id="app"></div>
</main>
<script>
const PARTS = ["Part 1 · Git · GitHub · Pages","Part 2 · AI 를 이해하는 말","Part 3 · 찾아서 고치는 부탁"];
const TYPE = {mc:"4지선다",fill:"빈칸",sit:"상황",fix:"부탁 고치기",ox:"OX",order:"순서",match:"짝 맞히기"};
const STAR = ["","★ 쉬움","★★ 보통","★★★ 어려움"];
// 유형 mc/fill/sit/fix: o=보기, a=정답 번호(1~4) · ox: a="O"|"X" · order: o=A~D 보기, a=정답 순서 · match: t=용어, d=설명, a=용어별 설명 번호
const Q = [
{n:1,p:0,k:"mc",d:1,q:"고칠 때마다 저장 지점을 찍어 두는, 파일의 세이브 포인트 같은 프로그램은?",o:["Python","Orca","Git","Node.js"],a:3,e:"Git 은 저장 지점을 찍어 두고, 망가지면 잘 되던 지점으로 돌아가게 해 줍니다."},
{n:2,p:0,k:"fill",d:1,q:"Git 이 지켜보는 폴더를 (    )(이)라고 합니다.",o:["저장소","휴지통","바탕화면","토큰"],a:1,e:"저장소는 영어로 repository, 줄여서 repo 라고 합니다."},
{n:3,p:0,k:"ox",d:2,q:"저장소 안에 숨어 있는 .git 폴더가 Git 의 기록장이다.",a:"O",e:"저장 지점(커밋)이 모두 .git 폴더 안에 기록됩니다."},
{n:4,p:0,k:"mc",d:1,q:"바뀐 것을 묶어 저장 지점 하나로 남기는 일은?",o:["클론","풀","푸시","커밋"],a:4,e:"\"커밋해 줘\" 하면 쌓인 변경을 묶어 기록장에 점 하나로 남깁니다."},
{n:5,p:0,k:"mc",d:2,q:"커밋 메시지(이름표)로 가장 좋은 것은?",o:["ㅇㅇ","점수 표시 추가","1","수정"],a:2,e:"무엇을 바꿨는지 한 줄로 적어야 나중에 이름표만 보고 그때를 찾습니다."},
{n:6,p:0,k:"ox",d:2,q:"Ctrl+S 로 저장만 해 두어도 예전 모습으로 돌아갈 수 있는 점이 생긴다.",a:"X",e:"저장은 지금 모습으로 덮어쓰기, 돌아갈 점은 커밋해야 남습니다."},
{n:7,p:0,k:"mc",d:2,q:"두 커밋을 비교했을 때 빨간색 − 줄은 무엇일까?",o:["들어온 줄","빠진 줄","그대로인 줄","오류가 난 줄"],a:2,e:"빨강 − 는 빠진 줄, 초록 + 는 들어온 줄입니다."},
{n:8,p:0,k:"fill",d:2,q:"두 커밋의 차이, 즉 바뀐 줄을 영어로 (    )(이)라고 합니다.",o:["push","token","repo","diff"],a:4,e:"diff 는 차이(difference)를 줄인 말입니다."},
{n:9,p:0,k:"match",d:2,q:"용어와 설명을 짝 지어 봅니다.",t:["로컬","원격","Git","GitHub"],d2:["인터넷에 있는 저장소","내 컴퓨터에 있는 저장소","저장소를 인터넷에 보관해 주는 사이트","내 컴퓨터에서 바뀐 것을 커밋으로 기록하는 프로그램"],a:[2,1,4,3],e:"Git 은 프로그램, GitHub 는 보관소입니다. 같은 저장소가 로컬과 원격 두 곳에 있습니다."},
{n:10,p:0,k:"mc",d:1,q:"내 컴퓨터의 커밋을 GitHub 로 올려 보내는 일은?",o:["푸시","새로 고침","풀","커밋"],a:1,e:"푸시는 파일 하나가 아니라 저장 지점 묶음을 올립니다."},
{n:11,p:0,k:"ox",d:2,q:"커밋을 하나도 하지 않았어도 푸시하면 바뀐 파일이 GitHub 로 올라간다.",a:"X",e:"푸시는 커밋을 올리는 일이라, 커밋이 없으면 올릴 것도 없습니다."},
{n:12,p:0,k:"mc",d:2,q:"GitHub 에 있는 저장소를 내 컴퓨터로 처음 통째로 받아 오는 일은?",o:["풀","푸시","클론","커밋"],a:3,e:"처음 한 번은 클론, 이미 있으면 풀로 새 커밋만 받습니다."},
{n:13,p:0,k:"sit",d:3,q:"집 컴퓨터에 이미 저장소가 있다. 학원에서 올린 새 커밋만 받아 오고 싶을 때 하는 부탁은?",o:["\"다시 푸시해 줘\"","\"저장소를 클론해 줘\"","\"GitHub 의 새 커밋을 풀 해 줘\"","\"지금 상태를 커밋해 줘\""],a:3,e:"이미 저장소가 있으면 통째로 받지 않고 풀로 새 커밋만 받습니다."},

{n:15,p:0,k:"fill",d:3,q:"주소 my-id.github.io/QUEST-TRACK-2/week-02/ 에서 QUEST-TRACK-2 는 (    ) 이름입니다.",o:["GitHub 아이디","폴더","모델","저장소"],a:4,e:"my-id 는 GitHub 아이디, QUEST-TRACK-2 는 저장소, week-02 는 폴더입니다."},
{n:16,p:0,k:"order",d:3,q:"고친 게임을 친구가 주소로 보기까지, 일어나는 순서대로 놓아 봅니다.",o:{A:"파일 고치기",B:"푸시",C:"커밋",D:"1~2분 뒤 Pages 반영"},a:"ACBD",e:"고치고, 커밋해서 남기고, 푸시로 올리면 Pages 가 1~2분 뒤 새 모습을 보여 줍니다."},

{n:21,p:1,k:"fill",d:2,q:"LLM 은 수많은 글에서 (    ) 말을 가리고 맞혀 보는 연습으로 배웁니다.",o:["영어","다음","맨 처음","가장 긴"],a:2,e:"가린 다음 말을 맞혀 보고 정답과 비교하는 연습을 셀 수 없이 반복합니다."},
{n:22,p:1,k:"order",d:2,q:"AI 가 답을 만드는 순서대로 놓아 봅니다.",o:{A:"그중 그럴듯한 말을 골라 붙인다",B:"지금까지의 글을 본다",C:"다음 말 후보를 떠올린다",D:"답이 끝날 때까지 반복한다"},a:"BCAD",e:"지금까지 글을 보고 후보를 떠올린 뒤, 그럴듯한 말을 골라 붙이기를 반복합니다."},

{n:26,p:1,k:"ox",d:2,q:"글자 수와 토큰(조각) 수는 언제나 똑같다.",a:"X",e:"한글은 1~2글자, 영어는 단어나 단어 조각이 한 토큰이라 글자 수와 다릅니다."},

const NUM = "①②③④", KO = "가나다라";
const app = document.getElementById("app");
let list = [], idx = 0, score = 0, part = -1;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function gameOver(){ home("💥 기체가 파손됐어요! 다시 도전해 보세요."); }

function home(msg){
  part = -1; resetHp();
  app.innerHTML = '<div class="card">' + (msg?`<div class="fb no"><b>${msg}</b></div>`:"") + '<b>Part 를 골라 주세요</b>' +
    PARTS.map((n,i)=>{const c=Q.filter(q=>q.p===i).length;return `<button class="part" data-p="${i}"><b>${n}</b><span class="sub">${c}문제</span></button>`;}).join("") + '</div>';
  app.querySelectorAll(".part").forEach(b=>b.onclick=()=>start(+b.dataset.p));
}

function start(p){
  part = p; list = Q.filter(q=>q.p===p); idx = 0; score = 0; resetHp(); show();
}

function show(){
  const q = list[idx];
  app.innerHTML = `<div class="card">
    <div class="meta"><span>${PARTS[part]}</span><span>${idx+1} / ${list.length}</span></div>
    <div class="bar"><i style="width:${idx/list.length*100}%"></i></div>
    <div class="meta" style="margin-top:12px"><span>[Q${q.n} · ${TYPE[q.k]} · ${STAR[q.d]}]</span></div>
    <div class="q">${esc(q.q)}</div>
    <div id="body"></div><div id="fb"></div></div>`;
  ({mc:choice,fill:choice,sit:choice,fix:choice,ox,order,match})[q.k](q, document.getElementById("body"));
}

function done(q, right, answerText){
  if(right){ score++; dodge(false); } else dodge(true);
  const last = idx === list.length-1;
  document.getElementById("fb").innerHTML =
    `<div class="fb ${right?"ok":"no"}"><b>${right?"⭕ 맞았어요!":"❌ 아쉬워요"}</b>` +
    (right?"":`정답: ${esc(answerText)}<br>`) + esc(q.e) + `</div>` +
    `<div class="row"><button class="btn" id="next">${last?"결과 보기":"다음 문제"}</button></div>`;
  document.getElementById("next").onclick = () => { idx++; idx<list.length ? show() : result(); };
  document.getElementById("next").focus();
}

function choice(q, el){
  el.innerHTML = q.o.map((t,i)=>`<button class="opt" data-i="${i+1}">${NUM[i]} ${esc(t)}</button>`).join("");
  const bs = el.querySelectorAll(".opt");
  bs.forEach(b=>b.onclick=()=>{
    const pick = +b.dataset.i;
    bs.forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a) x.classList.add("ok");});
    if(pick!==q.a) b.classList.add("no"); else b.classList.add("hit");
    done(q, pick===q.a, `${NUM[q.a-1]} ${q.o[q.a-1]}`);
  });
}

function ox(q, el){
  el.innerHTML = '<div class="row"><button class="opt ox" data-v="O">O</button><button class="opt ox" data-v="X">X</button></div>';
  const bs = el.querySelectorAll(".ox");
  bs.forEach(b=>b.onclick=()=>{
    bs.forEach(x=>{x.disabled=true; if(x.dataset.v===q.a) x.classList.add("ok");});
    if(b.dataset.v!==q.a) b.classList.add("no"); else b.classList.add("hit");
    done(q, b.dataset.v===q.a, q.a);
  });
}

function order(q, el){
  let seq = "";
  const render = () => {
    el.innerHTML = Object.keys(q.o).map(k=>`<button class="opt ${seq.includes(k)?"sel":""}" data-k="${k}" ${seq.includes(k)?"disabled":""}><b>${k}</b> ${esc(q.o[k])}</button>`).join("") +
      `<div class="sub" style="margin-top:12px">고른 순서</div><div class="chips">${[...seq].map(k=>`<span class="chip">${k}</span>`).join("")}</div>
       <div class="row"><button class="ghost" id="rs">다시 고르기</button><button class="btn" id="ok" ${seq.length<4?"disabled":""}>확인</button></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{seq+=b.dataset.k; render();});
    el.querySelector("#rs").onclick = () => {seq=""; render();};
    el.querySelector("#ok").onclick = () => {
      el.querySelectorAll("button").forEach(b=>b.disabled=true);
      done(q, seq===q.a, [...q.a].join(" → "));
    };
  };
  render();
}

function match(q, el){
  const pick = [0,0,0,0];
  const render = () => {
    el.innerHTML = '<div class="sub">설명</div>' + q.d2.map((t,i)=>`<div>${KO[i]} ${esc(t)}</div>`).join("") +
      q.t.map((t,i)=>`<div class="mrow"><span class="t">${i+1} ${esc(t)}</span><br>` +
        [0,1,2,3].map(j=>`<button class="opt ${pick[i]===j+1?"sel":""}" data-i="${i}" data-j="${j+1}">${KO[j]}</button>`).join("") + `</div>`).join("") +
      `<div class="row"><button class="btn" id="ok" ${pick.includes(0)?"disabled":""}>확인</button></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{pick[+b.dataset.i]=+b.dataset.j; render();});
    el.querySelector("#ok").onclick = () => {
      el.querySelectorAll("button").forEach(b=>b.disabled=true);
      done(q, pick.every((v,i)=>v===q.a[i]), q.a.map((v,i)=>`${i+1}-${KO[v-1]}`).join(" · "));
    };
  };
  render();
}

function result(){
  const total = list.length, pct = Math.round(score/total*100);
  const msg = pct===100?"완벽해요! 🎉":pct>=70?"잘했어요! 👍":"한 번 더 풀어 보면 더 잘할 수 있어요.";
  app.innerHTML = `<div class="card"><div class="sub">${PARTS[part]}</div>
    <div class="score">${score} / ${total}점</div><div>${msg}</div>
    <div class="row" style="margin-top:16px"><button class="btn" id="again">다시 풀기</button><button class="ghost" id="home">Part 다시 고르기</button></div></div>`;
  document.getElementById("again").onclick = () => start(part);
  document.getElementById("home").onclick = () => home();
}

// 1인칭 우주 비행: 별이 다가오고, 정답을 맞히면 운석이 날아와 우주선이 옆으로 피한다
(function(){
  const cv=document.getElementById("space"), c=cv.getContext("2d");
  let W,H,cam={x:0,r:0},met=null,last=performance.now();
  const stars=Array.from({length:240},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
  const cp=document.getElementById("cp"), p=cp.getContext("2d");
  const size=()=>{W=cv.width=cp.width=innerWidth;H=cv.height=cp.height=innerHeight;};
  addEventListener("resize",size); size();
  const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
  // 조종: ← → (또는 A D, 화면의 ◀ ▶ 버튼)
  let axis=0, dodged=0, hp=100, shake=0, flash=0;
  window.resetHp=()=>{hp=100;dodged=0;showHud();};
  const keys={}, btn={l:false,r:false};
  const upd=()=>{axis=((keys.ArrowRight||keys.d||btn.r)?1:0)-((keys.ArrowLeft||keys.a||btn.l)?1:0);};
  addEventListener("keydown",e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();
    if(k==="ArrowLeft"||k==="ArrowRight"){e.preventDefault();} keys[k]=true; upd();});
  addEventListener("keyup",e=>{const k=e.key.length>1?e.key:e.key.toLowerCase(); keys[k]=false; upd();});
  [["bl","l"],["br","r"]].forEach(([id,k])=>{
    const b=document.getElementById(id);
    b.addEventListener("pointerdown",e=>{e.preventDefault();btn[k]=true;upd();});
    ["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,()=>{btn[k]=false;upd();}));
  });
  const hud=document.getElementById("hud");
  const showHud=()=>{hud.textContent=`← → 로 조종 · 기체 ${hp>0?"❤".repeat(hp/20):"파손!"} · 피함 ${dodged}`;};
  showHud();
  // dmg=true(오답): 정면으로 날아와 반드시 부딪힌다. 정답이면 데미지 없음.
  let auto=null;
  window.dodge=function(dmg){
    if(!dmg) auto={dir:Math.random()<.5?-1:1,t:0};
    met={z:1,rot:0,dmg,x:dmg?cam.x:cam.x+(Math.random()-.5)*.4,spin:(Math.random()-.5)*3,checked:false,
         pts:Array.from({length:11},()=>.78+Math.random()*.4)};
  };
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    const f=H*.5, cx=W/2, cy=H/2;
    // 내가 조종: 좌우로 움직이고 기울어진다
    let ax=axis;
    if(!ax&&auto){ // 정답: 핸들이 저절로 한쪽으로 돌았다가 반대쪽으로 돌아온다
      auto.t+=dt; const t=auto.t;
      ax=t<.5?0:t<1.1?auto.dir:t<1.7?0:t<2.3?-auto.dir:0; if(t>2.3)auto=null;
    }
    cam.x=Math.max(-1.3,Math.min(1.3,cam.x+ax*dt*1.5));
    cam.r+=(-ax*.15-cam.r)*Math.min(1,dt*6);
    shake=Math.max(0,shake-dt); flash=Math.max(0,flash-dt*2);
    c.setTransform(1,0,0,1,0,0);
    c.fillStyle="#04050c"; c.fillRect(0,0,W,H);
    const g=c.createRadialGradient(cx*1.3,cy*.7,0,cx*1.3,cy*.7,Math.max(W,H)*.6);
    g.addColorStop(0,"rgba(90,60,170,.28)"); g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g; c.fillRect(0,0,W,H);
    c.translate(cx+(shake?(Math.random()-.5)*shake*30:0),cy+(shake?(Math.random()-.5)*shake*30:0)); c.rotate(cam.r);
    for(const s of stars){
      s.z-=dt*.22; if(s.z<=.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;}
      const sx=(s.x-cam.x*.4)/s.z*f*.5, sy=s.y/s.z*f*.5;
      const a=Math.min(1,(1-s.z)*1.6+.15), r=Math.max(.5,(1-s.z)*2.2);
      c.fillStyle=`rgba(255,255,255,${a})`; c.fillRect(sx,sy,r,r);
    }
    if(met){
      met.z-=dt*.6; met.rot+=met.spin*dt;
      if(!met.checked&&met.z<=.12){
        met.checked=true;
        if(met.dmg){hp=Math.max(0,hp-20);shake=.5;flash=1;if(hp===0)setTimeout(()=>gameOver(),1400);} else if(Math.abs(met.x-cam.x)>=.4) dodged++;
        showHud();
      }
      const sx=(met.x-cam.x)/met.z*f, sy=.02/met.z*f, R=.22/met.z*f;
      if(met.z<=.03||Math.abs(sx)>W*2){met=null;}
      else{
        c.save(); c.translate(sx,sy); c.rotate(met.rot);
        c.beginPath();
        met.pts.forEach((p,i)=>{const a=i/met.pts.length*Math.PI*2; c.lineTo(Math.cos(a)*R*p,Math.sin(a)*R*p);});
        c.closePath();
        const m=c.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R*1.1);
        m.addColorStop(0,"#b49a82"); m.addColorStop(1,"#3b2f2a");
        c.fillStyle=m; c.shadowColor="rgba(255,140,60,.6)"; c.shadowBlur=R*.4; c.fill();
        c.restore();
      }
    }
    if(flash>0){c.setTransform(1,0,0,1,0,0);c.fillStyle=`rgba(255,60,40,${flash*.45})`;c.fillRect(0,0,W,H);}
    drawCockpit(now);
    requestAnimationFrame(frame);
  }
  // 조종석: 창틀 기둥, 계기판, 그리고 내가 잡고 움직이는 조종간
  function drawCockpit(now){
    p.setTransform(1,0,0,1,0,0); p.clearRect(0,0,W,H);
    if(shake) p.translate((Math.random()-.5)*shake*10,(Math.random()-.5)*shake*10);
    const dh=Math.min(170,H*.24), top=H-dh, t=now/1000;
    p.fillStyle="#0b0f19"; p.strokeStyle="#3a4560"; p.lineWidth=2;
    for(const s of [1,-1]){ // 양옆 창틀 기둥
      const x0=s>0?0:W;
      p.beginPath(); p.moveTo(x0,0); p.lineTo(x0+s*W*.15,0); p.lineTo(x0,H*.6); p.closePath(); p.fill(); p.stroke();
    }
    p.fillRect(0,0,W,14); // 윗틀
    // 계기판
    const g=p.createLinearGradient(0,top-20,0,H); g.addColorStop(0,"#1c2438"); g.addColorStop(1,"#070a12");
    p.fillStyle=g; p.beginPath(); p.moveTo(0,H); p.lineTo(0,top+34); p.quadraticCurveTo(W/2,top-26,W,top+34); p.lineTo(W,H); p.closePath(); p.fill(); p.stroke();
    // 게이지(바늘이 흔들림)와 깜빡이는 불빛
    for(let i=0;i<3;i++) for(const s of [-1,1]){
      const gx=W/2+s*(W*.2+i*W*.07), gy=top+dh*.5, r=Math.min(15,W*.025);
      p.fillStyle="#05070d"; p.beginPath(); p.arc(gx,gy,r,0,7); p.fill(); p.stroke();
      const a=Math.sin(t*(1.3+i*.4)+s)*1.1-1.57;
      p.strokeStyle="#4ade80"; p.beginPath(); p.moveTo(gx,gy); p.lineTo(gx+Math.cos(a)*r*.8,gy+Math.sin(a)*r*.8); p.stroke(); p.strokeStyle="#3a4560";
    }
    ["#4ade80","#facc15","#f87171"].forEach((col,i)=>{
      p.fillStyle=col; p.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+i*1.7));
      p.beginPath(); p.arc(W/2-34+i*34,top+dh*.18,5,0,7); p.fill();
    }); p.globalAlpha=1;
    // 조종간: 좌우로 움직이면 같이 기운다
    const ang=-cam.r*3, len=dh*1.05, bar=Math.min(120,W*.2);
    p.save(); p.translate(W/2,H+14); p.rotate(ang);
    p.fillStyle="#2b3550"; p.fillRect(-9,-len,18,len);
    p.fillStyle="#3a4668"; p.beginPath(); p.roundRect(-bar,-len-9,bar*2,18,9); p.fill();
    for(const s of [-1,1]){ // 양손
      p.fillStyle="#1f2a4a"; p.beginPath(); p.ellipse(s*bar,-len,15,22,0,0,7); p.fill();
      p.fillStyle="#d9a98a"; p.beginPath(); p.arc(s*bar,-len-22,9,0,7); p.fill();
    }
    p.restore();
  }
  requestAnimationFrame(frame);
})();

home();
</script>
